<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/native.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form — Block</title>
    <link rel="stylesheet" href="../../../styles/index.css" />
    <link rel="stylesheet" href="../../../styles/components.css" />
    <style>
      body {
        background: var(--n-doc-neutral);
        color: var(--n-color-neutral-950);
      }

      main {
        padding: 2rem;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0;
      }

      .form-wrapper {
        max-width: 32rem;
      }
    </style>
  </head>
  <body>
    <native-app-spa><main>
    <n-stack gap="6">
    <div>
      <h1>Contact Us</h1>
      <p style="color: var(--n-ink-muted-neutral); font-size: 0.875rem;">
        Have a question or feedback? Fill out the form below and we'll get back to you within 24 hours.
      </p>
    </div>

    <div class="form-wrapper">
      <n-card>
        <n-header>
          <span slot="label">Send us a message</span>
        </n-header>
        <n-body>
          <form id="contact-form">
            <n-stack gap="4">
              <n-field required>
                <label slot="label">Full name</label>
                <n-input placeholder="Jane Doe" name="name">
                  <n-icon name="user" slot="leading"></n-icon>
                </n-input>
              </n-field>

              <n-field required>
                <label slot="label">Email address</label>
                <n-input placeholder="you@example.com" name="email">
                  <n-icon name="envelope" slot="leading"></n-icon>
                </n-input>
                <span slot="description">We'll never share your email with anyone else.</span>
              </n-field>

              <n-field required>
                <label slot="label">Subject</label>
                <n-select name="subject" placeholder="Select a topic">
                  <n-button justify="spread">
                    <span slot="label">Select a topic</span>
                    <n-icon name="caret-up-down" slot="trailing"></n-icon>
                  </n-button>
                  <n-listbox popover>
                    <n-option value="general">General Inquiry</n-option>
                    <n-option value="support">Technical Support</n-option>
                    <n-option value="sales">Sales</n-option>
                    <n-option value="partnership">Partnership</n-option>
                  </n-listbox>
                </n-select>
              </n-field>

              <n-field required>
                <label slot="label">Message</label>
                <n-textarea placeholder="Tell us how we can help..." rows="5" name="message" autogrow></n-textarea>
                <span slot="description">Minimum 20 characters.</span>
              </n-field>
            </n-stack>
          </form>
        </n-body>
        <n-footer>
          <n-button variant="ghost"><span slot="label">Cancel</span></n-button>
          <n-button variant="primary" intent="accent" type="submit" form="contact-form">
            <n-icon name="envelope" slot="leading"></n-icon>
            <span slot="label">Send Message</span>
          </n-button>
        </n-footer>
      </n-card>
    </div>
    </n-stack>

    </main></native-app-spa>
    <script type="module">
      import '../../../nav/native-app.ts';
      import '../../../components/field/field.ts';
      import '../../../components/input/input.ts';
      import '../../../components/textarea/textarea.ts';
      import '../../../components/select/select.ts';
      import '../../../components/listbox/listbox.ts';
      import '../../../components/listbox/option.ts';
      import '../../../components/button/button.ts';
      import '../../../containers/card/card.ts';
      import '../../../icons/icon.ts';
      import '../../../icons/phosphor/user.ts';
      import '../../../icons/phosphor/envelope.ts';
      import '../../../icons/phosphor/caret-up-down.ts';
    </script>
  </body>
</html>
