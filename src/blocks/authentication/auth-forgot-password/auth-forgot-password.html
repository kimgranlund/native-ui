<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/native.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — Auth Block</title>
    <link rel="stylesheet" href="../../../styles/n-index.css" />
    <link rel="stylesheet" href="../../../styles/n-components.css" />
    <style>
      body { background: var(--n-doc-neutral); color: var(--n-color-neutral-950); }
      main { padding: 2rem; }
      h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
      h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; margin-top: 2rem; color: var(--n-ink-strong-neutral); }

      .auth-centered {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 8rem);
      }

      .auth-card-wrapper {
        width: 100%;
        max-width: 24rem;
      }

      .auth-icon-circle {
        width: 3rem;
        height: 3rem;
        border-radius: 50%;
        background: var(--n-surface-accent);
        color: var(--n-surface-ink-accent);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1rem;
      }

      .auth-heading {
        text-align: center;
        margin-bottom: 0.25rem;
        font-size: 1.25rem;
        font-weight: 700;
      }

      .auth-subheading {
        text-align: center;
        color: var(--n-ink-muted-neutral);
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
        line-height: 1.5;
      }

      .auth-back-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.375rem;
        font-size: 0.8125rem;
        color: var(--n-ink-muted-neutral);
        text-decoration: none;
        margin-top: 1.5rem;
      }

      .auth-back-link:hover {
        color: var(--n-ink-neutral);
      }
    </style>
  </head>
  <body>
    <native-dashboard-spa><main>
    <h1>Forgot Password</h1>
    <p style="color: var(--n-ink-muted-neutral); font-size: 0.875rem; margin-bottom: 1.5rem;">
      Minimal password reset request card with email input and back-to-login link.
    </p>

    <!-- ── Reset Password Card ── -->

    <h2>Reset Password</h2>
    <div style="background: var(--n-body-neutral); border: 1px solid var(--n-border-muted-neutral); border-radius: 0.5rem; overflow: hidden; margin-bottom: 1rem;">
      <div class="auth-centered" style="min-height: 32rem;">
        <div class="auth-card-wrapper">
          <div class="auth-icon-circle">
            <n-icon name="envelope" size="lg"></n-icon>
          </div>
          <p class="auth-heading">Reset your password</p>
          <p class="auth-subheading">
            Enter the email address associated with your account and we'll send you a link to reset your password.
          </p>
          <n-card>
            <form>
              <n-stack gap="4">
                <n-field required>
                  <label slot="label">Email address</label>
                  <n-input type="email" placeholder="kim@example.com" name="email">
                    <n-icon name="envelope" slot="leading"></n-icon>
                  </n-input>
                </n-field>
                <n-button variant="primary" intent="accent" type="submit">
                  <span slot="label">Send Reset Link</span>
                </n-button>
              </n-stack>
            </form>
          </n-card>
          <a href="#" class="auth-back-link">
            <n-icon name="arrow-left" size="sm"></n-icon>
            Back to sign in
          </a>
        </div>
      </div>
    </div>

    </main></native-dashboard-spa>
    <script type="module">
      import '../../../nav/native-dashboard.ts';
      import '../../../components/button/button.ts';
      import '../../../components/input/input.ts';
      import '../../../components/field/field.ts';
      import '../../../containers/card/card.ts';
      import '../../../icons/icon.ts';
      import '../../../icons/phosphor/envelope.ts';
      import '../../../icons/phosphor/arrow-left.ts';
    </script>
  </body>
</html>
