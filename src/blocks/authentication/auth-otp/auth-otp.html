<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/native.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP — Auth Block</title>
    <link rel="stylesheet" href="../../../styles/index.css" />
    <link rel="stylesheet" href="../../../styles/components.css" />
    <style>
      body { background: var(--n-doc-neutral); color: var(--n-color-neutral-950); }
      main { padding: 2rem; }
      h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
      h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; margin-top: 2rem; color: var(--n-ink-strong-neutral); }

      .auth-centered {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 8rem);
      }

      .auth-card-wrapper {
        width: 100%;
        max-width: 24rem;
      }

      .auth-icon-circle {
        width: 3rem;
        height: 3rem;
        border-radius: 50%;
        background: var(--n-surface-accent);
        color: var(--n-surface-ink-accent);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1rem;
      }

      .auth-heading {
        text-align: center;
        margin-bottom: 0.25rem;
        font-size: 1.25rem;
        font-weight: 700;
      }

      .auth-subheading {
        text-align: center;
        color: var(--n-ink-muted-neutral);
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
        line-height: 1.5;
      }

      .auth-email-highlight {
        font-weight: 600;
        color: var(--n-ink-strong-neutral);
      }

      .auth-resend-text {
        text-align: center;
        font-size: 0.8125rem;
        color: var(--n-ink-muted-neutral);
      }

      .auth-resend-link {
        color: var(--n-ink-accent);
        font-weight: 500;
        font-size: inherit;
        min-height: unset;
        padding: 0;
      }

      .auth-resend-link:hover {
        text-decoration: underline;
      }

      .auth-back-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.375rem;
        font-size: 0.8125rem;
        color: var(--n-ink-muted-neutral);
        text-decoration: none;
        margin-top: 1.5rem;
      }

      .auth-back-link:hover {
        color: var(--n-ink-neutral);
      }

      .otp-center {
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <native-app><main>
    <h1>OTP Verification</h1>
    <p style="color: var(--n-ink-muted-neutral); font-size: 0.875rem; margin-bottom: 1.5rem;">
      6-digit one-time password verification step with resend and back link.
    </p>

    <!-- ── OTP Verification Card ── -->

    <h2>Enter Verification Code</h2>
    <div style="background: var(--n-body-neutral); border: 1px solid var(--n-border-muted-neutral); border-radius: 0.5rem; overflow: hidden; margin-bottom: 1rem;">
      <div class="auth-centered" style="min-height: 32rem;">
        <div class="auth-card-wrapper">
          <div class="auth-icon-circle">
            <n-icon name="shield-check" size="lg"></n-icon>
          </div>
          <p class="auth-heading">Enter verification code</p>
          <p class="auth-subheading">
            We sent a 6-digit code to <span class="auth-email-highlight">kim@example.com</span>. Enter it below to verify your identity.
          </p>
          <n-card>
            <n-stack gap="4">
              <form>
                <n-stack gap="4">
                  <div class="otp-center">
                    <n-input-otp name="otp" length="6"></n-input-otp>
                  </div>
                  <n-button variant="primary" intent="accent" type="submit">
                    <span slot="label">Verify</span>
                  </n-button>
                </n-stack>
              </form>
              <p class="auth-resend-text">
                Didn't receive a code? <n-button variant="ghost" inline class="auth-resend-link">Resend code</n-button>
              </p>
            </n-stack>
          </n-card>
          <a href="#" class="auth-back-link">
            <n-icon name="arrow-left" size="sm"></n-icon>
            Back to sign in
          </a>
        </div>
      </div>
    </div>

    </main></native-app>
    <script type="module">
      import '../../../nav/layout.ts';
      import '../../../components/button/button.ts';
      import '../../../components/input-otp/input-otp.ts';
      import '../../../containers/card/card.ts';
      import '../../../icons/icon.ts';
      import '../../../icons/phosphor/shield-check.ts';
      import '../../../icons/phosphor/arrow-left.ts';
    </script>
  </body>
</html>
