<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/native.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP — Auth Block</title>
    <link rel="stylesheet" href="../../../styles/spa/spa-app.css" />
    <link rel="stylesheet" href="../../../styles/css/components.native-ui.css" />
    <link rel="stylesheet" href="../../../styles/spa/spa-pages.css" />
    <style>
      body { background: var(--n-doc-neutral); color: var(--n-color-neutral-950); }
      h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
      h2 { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; margin-top: 2rem; color: var(--n-ink-strong-neutral); }

      .auth-icon-circle {
        width: 3rem;
        height: 3rem;
        border-radius: 50%;
        background: var(--n-surface-accent);
        color: var(--n-surface-ink-accent);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .auth-link {
        color: var(--n-ink-accent);
        text-decoration: none;
        font-weight: 500;
      }
      .auth-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <native-dashboard-spa><main>

    <header>
      <div>
        <h1>OTP Verification</h1>
        <p style="color: var(--n-ink-muted-neutral); font-size: 0.875rem; margin-bottom: 1.5rem;">6-digit one-time password verification step with resend and back link.</p>
      </div>
    </header>

    <section>

    <!-- ── OTP Verification Card ── -->

    <h2>Enter Verification Code</h2>
    <div style="background: var(--n-body-neutral); border: 1px solid var(--n-border-muted-neutral); border-radius: 0.5rem; overflow: hidden; margin-bottom: 1rem;">
      <div style="display: flex; justify-content: center; align-items: center; min-height: 32rem;">
        <n-container bordered inline padding="4" gap="4" style="width: 100%; max-width: 24rem;">
          <n-header align="center" style="display: flex; flex-direction: column; gap: 0.25rem;">
            <div class="auth-icon-circle" style="margin-bottom: 0.5rem;">
              <n-icon name="shield-check" size="lg"></n-icon>
            </div>
            <strong style="font-size: 1.25rem;">Enter verification code</strong>
            <span style="color: var(--n-ink-muted-neutral); font-size: 0.875rem; line-height: 1.5;">
              We sent a 6-digit code to <span style="font-weight: 600; color: var(--n-ink-strong-neutral);">kim@example.com</span>. Enter it below to verify your identity.
            </span>
          </n-header>
          <n-body>
            <n-stack gap="4">
              <form>
                <n-stack gap="4">
                  <div style="display: flex; justify-content: center;">
                    <n-input-otp name="otp" length="6"></n-input-otp>
                  </div>
                  <n-button variant="primary" intent="accent" type="submit">
                    <span slot="label">Verify</span>
                  </n-button>
                </n-stack>
              </form>
              <p style="text-align: center; font-size: 0.8125rem; color: var(--n-ink-muted-neutral); margin: 0;">
                Didn't receive a code? <n-button variant="ghost" inline style="color: var(--n-ink-accent); font-weight: 500; font-size: inherit; min-height: unset; padding: 0;">Resend code</n-button>
              </p>
            </n-stack>
          </n-body>
          <n-footer justify="center">
            <a href="#" class="auth-link" style="display: flex; align-items: center; gap: 0.375rem; font-size: 0.8125rem; color: var(--n-ink-muted-neutral);">
              <n-icon name="arrow-left" size="sm"></n-icon>
              Back to sign in
            </a>
          </n-footer>
        </n-container>
      </div>
    </div>

    </section>

  

    </main></native-dashboard-spa>
    <script type="module">
      import '../../../nav/native-dashboard.ts';
      import '../../../components/button/button.ts';
      import '../../../components/input-otp/input-otp.ts';
      import '../../../icons/icon.ts';
      import '../../../icons/phosphor/shield-check.ts';
      import '../../../icons/phosphor/arrow-left.ts';
    </script>
  </body>
</html>
