<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/native.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A2UI Training Library</title>
  <link rel="stylesheet" href="../../../../src/styles/spa/spa-app.css" />
  <link rel="stylesheet" href="../../../../src/styles/css/components.native-ui.css" />
  <link rel="stylesheet" href="../../../../packages/native-code/src/codemirror/css/editor.css" />
  <link rel="stylesheet" href="../../../../src/styles/spa/spa-pages.css" />
  <link rel="stylesheet" href="../chat/llm-chat/n-llm-chat-pane.css" />
  <link rel="stylesheet" href="./training-library.demo.css" />
</head>
<body>
  <native-dashboard-spa><main>

    <!-- ── Header toolbar ── -->
    <header>
      <h1>A2UI Training Library</h1>
      <div class="demo-desc">50 reusable UI composition patterns for grounding AI generation. Click any card to open the editor.</div>
    </header>

    <section>
      <!-- Filter bar -->
      <div class="tl-filter-bar">
        <n-button variant="primary" intent="accent" size="sm" data-filter="all">All</n-button>
        <n-button variant="ghost" size="sm" data-filter="micro">Micro</n-button>
        <n-button variant="ghost" size="sm" data-filter="block">Block</n-button>
        <n-select id="category-filter" placeholder="All categories" variant="outline" size="sm" density="compact">
          <n-listbox popover>
            <n-option value="">All categories</n-option>
          </n-listbox>
        </n-select>
        <span class="tl-count" id="pattern-count"></span>
      </div>

      <!-- Pattern Grid -->
      <div id="pattern-grid" class="tl-grid"></div>
    </section>

    <!-- ── Editor Lightbox ── -->
    <dialog id="editor-lightbox" class="tl-lightbox">
      <!-- ── Top toolbar (full width) ── -->
      <n-header>
        <n-toolbar variant="ghost" size="sm">
          <span id="lightbox-title" class="tl-lightbox-title">Pattern</span>
          <span id="lightbox-badges"></span>
          <span fill></span>
          <n-button variant="ghost" size="sm" id="compare-toggle" title="Compare with original">
            <n-icon name="arrows-left-right"></n-icon>
          </n-button>
          <hr aria-orientation="vertical">
          <n-button variant="primary" intent="accent" size="sm" data-chip="schema">Schema</n-button>
          <n-button variant="ghost" size="sm" data-chip="insights">Insights</n-button>
          <n-button variant="ghost" size="sm" data-chip="output">Output</n-button>
          <n-button variant="ghost" size="sm" data-chip="settings">Settings</n-button>
          <hr aria-orientation="vertical">
          <n-button variant="ghost" size="sm" id="chat-toggle" title="AI Chat">
            <n-icon name="chat-dots"></n-icon>
          </n-button>
          <n-button variant="ghost" size="sm" id="inspect-toggle" title="CSS Inspector">
            <n-icon name="stack-simple"></n-icon>
          </n-button>
          <n-button variant="ghost" size="sm" id="fullscreen-toggle" title="Fullscreen">
            <n-icon name="arrows-out-simple"></n-icon>
          </n-button>
          <n-button variant="ghost" size="sm" id="lightbox-close">
            <n-icon name="x"></n-icon>
          </n-button>
        </n-toolbar>
      </n-header>

      <!-- ── Split: preview left, editor right ── -->
      <n-panes handle="hover">
        <n-pane data-panel-id="preview" size-min="200">
          <div class="tl-preview-mount" id="lightbox-preview"></div>
        </n-pane>

        <n-pane data-panel-id="editor" size-min="280" size="440">
          <!-- Schema tab -->
          <div class="tl-tab-panel" data-tab="schema">
            <n-editor id="schema-editor" line-numbers="false"></n-editor>
          </div>

          <!-- Insights tab -->
          <div class="tl-tab-panel" data-tab="insights" hidden>
            <div id="insights-wrap" class="tl-insights-wrap"></div>
          </div>

          <!-- Output tab -->
          <div class="tl-tab-panel" data-tab="output" hidden>
            <n-editor id="output-pre" readonly line-numbers="false"></n-editor>
          </div>

          <!-- Settings tab -->
          <div class="tl-tab-panel" data-tab="settings" hidden>
            <div class="tl-settings-form">
              <label>Model</label>
              <n-select id="tl-model" variant="outline" size="sm" value="claude-haiku-4-5">
                <n-listbox popover>
                  <n-option value="claude-haiku-4-5" selected>Claude Haiku 4.5</n-option>
                  <n-option value="claude-sonnet-4-6">Claude Sonnet 4.6</n-option>
                  <n-option value="gpt-5-mini">GPT-5 mini</n-option>
                  <n-option value="gpt-4.1-mini">GPT-4.1 mini</n-option>
                </n-listbox>
              </n-select>

              <label>Temperature <span id="temp-val" class="tl-settings-val">0.7</span></label>
              <n-range id="tl-temperature" min="0" max="1" step="0.1" value="0.7"></n-range>

              <label>Max Tokens <span id="tokens-val" class="tl-settings-val">4096</span></label>
              <n-range id="tl-max-tokens" min="512" max="8192" step="512" value="4096"></n-range>

              <label>Multi-step Pipeline</label>
              <n-switch id="tl-pipeline-toggle"></n-switch>
            </div>
          </div>

          <!-- Action footer -->
          <n-footer class="tl-actions">
            <n-button variant="ghost" size="sm" id="btn-reset" disabled title="Reset to original">
              <n-icon name="arrow-counter-clockwise" slot="leading"></n-icon>
              Reset
            </n-button>
            <span fill></span>
            <n-button variant="outline" size="sm" id="btn-download">
              <n-icon name="download-simple" slot="leading"></n-icon>
              Download
            </n-button>
            <n-button variant="outline" size="sm" id="btn-save">
              <n-icon name="floppy-disk" slot="leading"></n-icon>
              Save
            </n-button>
            <n-button variant="outline" size="sm" id="btn-export">
              <n-icon name="copy" slot="leading"></n-icon>
              Export
            </n-button>
            <n-button variant="primary" intent="accent" size="sm" id="btn-regenerate">
              <n-icon name="arrow-clockwise" slot="leading"></n-icon>
              Regenerate
            </n-button>
          </n-footer>
        </n-pane>

        <!-- AI Chat pane (hidden by default, toggled via chat button) -->
        <n-pane data-panel-id="chat" size="360" size-min="280" hidden>
          <n-llm-chat-pane id="llm-chat-pane" open position="docked"></n-llm-chat-pane>
        </n-pane>
      </n-panes>
    </dialog>

  </main></native-dashboard-spa>

  <script type="module">
    import { registerAllTraits } from '../../../../packages/native-traits/src/traits/index.ts';
    registerAllTraits();
  </script>
  <script type="module" src="./training-library.demo.ts"></script>
</body>
</html>
