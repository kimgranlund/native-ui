component: NListbox
tag: n-listbox
category: component
description: Listbox component with single or multiple selection and keyboard navigation.
source:
  element: src/components/listbox/listbox-element.ts
  css: src/components/listbox/listbox.css
  registration: src/components/listbox/listbox.ts
  demo: src/components/listbox/listbox.html
attributes:
  disabled:
    type: boolean
    description: Disables interaction
  multiple:
    type: boolean
    description: Enables multi-select mode
  virtual-focus:
    type: boolean
    description: Uses active attribute instead of roving tabindex (for combobox)
css_attributes:
  active:
    type: boolean
    description: Highlights the currently focused option via virtual focus (set by keyboard navigation)
events:
  native:change:
    description: Fired when selection changes with `{ value, label }` detail
css_tokens:
  --n-background:
    description: Background color
    default: transparent
  --n-background-active:
    description: Background on press
    default: var(--n-panel-active)
  --n-background-disabled:
    description: Background when disabled
    default: transparent
  --n-background-hover:
    description: Background on hover
    default: var(--n-panel-hover)
  --n-border-color:
    description: Border color
    default: var(--n-border-rest)
  --n-border-muted-neutral:
    description: Muted border color
  --n-border-rest:
    description: Default border color at rest (tier-1 definition)
  --n-color:
    description: Text/foreground color
    default: var(--n-ink)
  --n-color-active:
    description: Text/foreground color
    default: var(--n-ink-active)
  --n-color-disabled:
    description: Text when disabled
    default: var(--n-ink-disabled)
  --n-color-hover:
    description: Text on hover
    default: var(--n-ink-hover)
  --n-control:
    description: Control surface color (tier-1 definition)
  --n-control-line-height:
    description: Line height
  --n-duration:
    description: Transition duration
  --n-easing:
    description: Transition easing
  --n-focus-ring:
    description: Focus ring style
  --n-font-size:
    description: Font size
  --n-font-weight:
    description: Font weight
    default: var(--n-text-font-weight)
  --n-group-header-font:
    description: Font style for option group headers
  --n-ink:
    description: Ink (text) color
  --n-ink-active:
    description: Ink (text) color
  --n-ink-disabled:
    description: Ink when disabled
  --n-ink-hover:
    description: Ink on hover
  --n-ink-muted:
    description: Ink (text) color
  --n-letter-spacing:
    description: Letter spacing
  --n-line-height:
    description: Line height
    default: var(--n-control-line-height)
  --n-panel-active:
    description: Panel surface color on press (tier-1 definition)
  --n-panel-hover:
    description: Panel surface color on hover (tier-1 definition)
  --n-popover-from:
    description: Initial transform for the popover open animation
    default: perspective(800px) scale(0.96) rotateX(-20deg)
  --n-popover-origin:
    description: Transform origin for the popover animation
    default: top center
  --n-radius:
    description: Border radius
  --n-size:
    description: Component height
  --n-space:
    description: Block/gap spacing
  --n-space-k:
    description: Inline padding multiplier
  --n-text-font-weight:
    description: Font weight
controllers:
  - ListNavigateController
  - DataListController
traits:
  compatible: [hover, focus-visible, list-navigate]
  incompatible: []
a11y:
  role: listbox
  keyboard:
    - key: ArrowDown
      action: Moves active highlight to the next option
    - key: ArrowUp
      action: Moves active highlight to the previous option
    - key: Home
      action: Moves active highlight to the first option
    - key: End
      action: Moves active highlight to the last option
    - key: Enter
      action: Selects the active option
    - key: Space
      action: Selects the active option
behavior:
  - trigger: native:select on n-option
    actions: [Selects or toggles option in single/multiple mode, dispatches native:change]
  - trigger: disabled attribute change
    actions: [Updates aria-disabled state]
compose:
  children: [n-option, n-option-group]
  parents: [n-select, n-combobox]
