component: NSelect
tag: n-select
category: component
description: Select dropdown coordinator wiring a trigger button to a popover listbox.
source:
  element: src/components/select/select-element.ts
  css: src/components/select/select.css
  registration: src/components/select/select.ts
  demo: src/components/select/select.html
attributes:
  value:
    type: string
    description: Currently selected value
  disabled:
    type: boolean
    description: Disables interaction
  name:
    type: string
    description: Form field name
  options:
    type: string
    description: JSON array of `{ value, label }` objects for data-driven mode
  src:
    type: string
    description: URL to fetch options from for data-driven mode
  placeholder:
    type: string
    description: Placeholder text when no value is selected
  required:
    type: string
    description: Marks the field as required for form validation
events:
  native:change:
    description: Fired when selection changes with `{ value, label }` detail
css_tokens:
  --n-duration:
    description: Transition duration
  --n-easing:
    description: Transition easing
  --n-popover-gap:
    description: Gap between items
  --n-popover-max-height:
    description: Maximum height of the dropdown popover
  --n-popover-viewport-margin:
    description: Minimum margin between the popover and viewport edge
controllers:
  - PopoverController
  - SelectController
traits:
  compatible: [hover, focus-visible, tooltip, dismissable]
  incompatible: []
a11y:
  role: combobox
  form_associated: true
  keyboard:
    - key: ArrowDown
      action: Opens the listbox if closed, moves focus to the next option
    - key: ArrowUp
      action: Opens the listbox if closed, moves focus to the previous option
    - key: Enter
      action: Selects the active option when open, toggles the listbox when closed
    - key: Space
      action: Selects the active option when open, toggles the listbox when closed
    - key: Escape
      action: Closes the listbox without changing selection
    - key: Home
      action: Moves focus to the first option
    - key: End
      action: Moves focus to the last option
behavior:
  - trigger: native:press on trigger
    actions: [Toggles the popover listbox open/closed]
  - trigger: native:select on option
    actions: [Sets value and label, closes popover, dispatches native:change]
  - trigger: native:dismiss
    actions: [Closes the popover listbox]
compose:
  children: [n-button, n-listbox, n-option, n-option-group]
  parents: [n-field, form]
