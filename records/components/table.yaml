component: NTable
tag: n-table
category: component
description: Data table with sortable columns, row selection, column resizing, and row reordering.
source:
  element: src/components/table/table-element.ts
  css: src/components/table/table.css
  registration: src/components/table/table.ts
  demo: src/components/table/table.html
attributes:
  selectable:
    type: boolean
    description: Enables row selection on click
  resizable:
    type: boolean
    description: Enables column resize handles
  reorderable:
    type: boolean
    description: Enables drag-to-reorder rows
  cols:
    type: string
    description: Sets grid-template-columns (e.g., "auto auto 1fr")
  sticky-header:
    type: boolean
    description: Enables sticky header row with measured height
css_attributes:
  variant:
    type: enum
    values:
      - plain
    description: Removes default borders and background styling
  sticky-column:
    type: boolean
    description: Enables sticky first column during horizontal scroll
  resizing:
    type: boolean
    description: Present while a column is being resized
  colspan:
    type: boolean
    description: Enables column spanning for header cells
  dragging:
    type: boolean
    description: Present while a row is being drag-reordered
  sticky:
    type: boolean
    description: Enables sticky positioning on headers
events:
  native:table-sort:
    description: Fired when sort changes with `{ column, direction }` detail
  native:table-select:
    description: Fired when row selection changes with `{ value, selected, allSelected }` detail
css_tokens:
  --n-background:
    description: Background color
    default: var(--n-panel)
  --n-border-color:
    description: Border color
    default: var(--n-border-muted)
  --n-border-muted:
    description: Muted border color
  --n-button-font-weight:
    description: Font weight
  --n-color:
    description: Text/foreground color
    default: var(--n-ink)
  --n-duration:
    description: Transition duration
  --n-easing:
    description: Transition easing
  --n-focus-ring:
    description: Focus ring style
  --n-font-size:
    description: Font size
  --n-font-weight:
    description: Font weight
    default: var(--n-text-font-weight)
  --n-group-header-font:
    description: Font size for group header labels
  --n-ink:
    description: Ink (text) color
  --n-ink-muted:
    description: Ink (text) color
  --n-ink-strong:
    description: Ink (text) color
  --n-letter-spacing:
    description: Letter spacing
  --n-line-height:
    description: Line height
    default: var(--n-text-line-height)
  --n-panel:
    description: Panel background color
  --n-panel-hover:
    description: Panel background on hover
  --n-radius:
    description: Border radius
  --n-space:
    description: Block/gap spacing
  --n-space-k:
    description: Inline padding multiplier
  --n-surface:
    description: Surface background color
  --n-surface-hover:
    description: Surface background on hover
  --n-surface-ink:
    description: Ink (text) color
  --n-surface-ink-hover:
    description: Ink on hover
  --n-text-font-weight:
    description: Font weight
  --n-text-line-height:
    description: Line height
controllers:
  - ColumnResizeController
  - TableDragController
traits:
  compatible: []
  incompatible: []
a11y:
  role: table
  keyboard:
    - key: Enter
      action: Toggles row selection when selectable
behavior:
  - trigger: click on sortable header
    actions: [Cycles sort direction and fires native:table-sort]
  - trigger: click on row (selectable)
    actions: [Toggles row selection and fires native:table-select]
compose:
  children: [n-table-head, n-table-body, n-table-row, n-table-header, n-table-cell]
  parents: []
