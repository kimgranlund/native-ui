component: NTextarea
tag: n-textarea
category: component
description: Multi-line text input using contenteditable with optional autogrow.
source:
  element: src/components/textarea/textarea-element.ts
  css: src/components/textarea/textarea.css
  registration: src/components/textarea/textarea.ts
  demo: src/components/textarea/textarea.html
attributes:
  value:
    type: string
    description: Current text value
  placeholder:
    type: string
    description: Placeholder text shown when empty
  disabled:
    type: boolean
    description: Disables interaction
  readonly:
    type: boolean
    description: Prevents editing while remaining focusable
  required:
    type: boolean
    description: Marks as required for form validation
  rows:
    type: number
    description: Minimum visible rows (sets min-height)
  maxlength:
    type: number
    description: Maximum character count
  autogrow:
    type: boolean
    description: Automatically grows height to fit content
  pattern:
    type: string
  formatting:
    type: string
    description: Space-separated list of enabled formats (e.g. "code bold italic")
  name:
    type: string
    description: Form field name
events:
  native:format:
    description: Fired after formatting with `{ type, value }` detail
  native:input:
    description: Fired on each keystroke with `{ value }` detail
  native:change:
    description: Fired on blur with `{ value }` detail
css_tokens:
  --n-background:
    description: Background color
    default: var(--n-control)
  --n-background-disabled:
    description: Background when disabled
    default: var(--n-control-disabled)
  --n-background-hover:
    description: Background on hover
    default: var(--n-control-hover)
  --n-border-color:
    description: Border color
    default: var(--n-border-rest)
  --n-border-color-disabled:
    description: Border when disabled
    default: transparent
  --n-border-color-hover:
    description: Border on hover
    default: var(--n-border-muted)
  --n-border-muted:
    description: Muted border color
  --n-border-muted-neutral:
    description: Muted border color
  --n-border-rest:
    description: Resting border color
  --n-color:
    description: Text/foreground color
    default: var(--n-ink)
  --n-color-disabled:
    description: Text when disabled
    default: var(--n-ink-disabled)
  --n-color-hover:
    description: Text on hover
    default: var(--n-ink-hover)
  --n-control:
    description: Control surface background
  --n-control-disabled:
    description: Control surface when disabled
  --n-control-hover:
    description: Control surface on hover
  --n-control-line-height:
    description: Line height
  --n-duration:
    description: Transition duration
  --n-easing:
    description: Transition easing
  --n-focus-ring:
    description: Focus ring style
  --n-font-size:
    description: Font size
  --n-font-weight:
    description: Font weight
    default: var(--n-input-font-weight)
  --n-ink:
    description: Ink (text) color
  --n-ink-disabled:
    description: Ink when disabled
  --n-ink-hover:
    description: Ink on hover
  --n-ink-placeholder:
    description: Ink (text) color
  --n-ink-strong:
    description: Ink (text) color
  --n-input-font-weight:
    description: Font weight
  --n-letter-spacing:
    description: Letter spacing
  --n-line-height:
    description: Line height
    default: var(--n-control-line-height)
  --n-panel:
    description: Panel background color
  --n-panel-hover:
    description: Panel background on hover
  --n-radius:
    description: Border radius
  --n-rows:
    description: Number of visible text rows for min-height calculation
    default: "10"
  --n-size:
    description: Component height
  --n-space:
    description: Block/gap spacing
  --n-space-k:
    description: Inline padding multiplier
traits:
  compatible: []
  incompatible: []
a11y:
  role: textbox
  form_associated: true
  keyboard:
    - key: Ctrl+B
      action: Toggles bold formatting when formatting includes "bold"
    - key: Ctrl+I
      action: Toggles italic formatting when formatting includes "italic"
behavior:
  - trigger: text input
    actions: [Updates value and fires native:input]
  - trigger: blur
    actions: [Fires native:change with final value]
compose:
  children: []
  parents: [n-field]
