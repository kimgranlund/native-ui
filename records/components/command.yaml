component: NCommand
tag: n-command
category: component
description: Command palette with filterable item list and keyboard navigation.
source:
  element: src/components/command/command-element.ts
  css: src/components/command/command.css
  registration: src/components/command/command.ts
  demo: src/components/command/command.html
attributes:
  disabled:
    type: boolean
    description: Disables interaction
events:
  native:change:
    description: Fired when an item is selected with `{ value, label }` detail
  native:dismiss:
    description: Fired on Escape key press
slots:
  heading:
    description: Optional heading displayed above the command list
css_tokens:
  --n-background:
    description: Background color
    default: var(--n-control)
  --n-border-color:
    description: Border color
    default: var(--n-border-rest)
  --n-border-muted-neutral:
    description: Muted border color
  --n-border-rest:
    description: Resting border color
  --n-color:
    description: Text/foreground color
    default: var(--n-ink)
  --n-control:
    description: Control surface background
  --n-control-line-height:
    description: Line height
  --n-duration:
    description: Transition duration
  --n-easing:
    description: Transition easing
  --n-font-size:
    description: Font size
  --n-font-weight:
    description: Font weight
  --n-group-header-font:
    description: Font size for group header labels
  --n-ink:
    description: Ink (text) color
  --n-ink-disabled:
    description: Ink when disabled
  --n-ink-muted:
    description: Ink (text) color
  --n-ink-placeholder:
    description: Ink (text) color
  --n-letter-spacing:
    description: Letter spacing
  --n-line-height:
    description: Line height
  --n-popover-max-height:
    description: Maximum height of the scrollable list area
  --n-radius:
    description: Border radius
  --n-size:
    description: Component height
  --n-space:
    description: Block/gap spacing
  --n-space-k:
    description: Inline padding multiplier
controllers:
  - DataListController
traits:
  compatible: []
  incompatible: []
a11y:
  role: search
  keyboard:
    - key: ArrowDown
      action: Moves highlight to the next visible item
    - key: ArrowUp
      action: Moves highlight to the previous visible item
    - key: Home
      action: Moves highlight to the first visible item
    - key: End
      action: Moves highlight to the last visible item
    - key: Enter
      action: Selects the highlighted item and fires native:change
    - key: Escape
      action: Fires native:dismiss for closing the palette
behavior:
  - trigger: typing in command-input
    actions: [Filters visible items by query text]
  - trigger: click on command-item
    actions: [Selects item and fires native:change with value and label]
compose:
  children: [n-command-input, n-command-list, n-command-group, n-command-item, n-command-empty]
  parents: [n-dialog]
