component: NInput
tag: n-input
category: component
description: |-
  Single-line text input using an inner contenteditable surface with form association.

  WHY inner surface: Browsers break contenteditable text insertion when the
  contenteditable element uses `display: flex` and contains child elements
  (like slot icons). Moving the editable surface into a child `<span>` inside
  the flex container fixes this — the flex host handles layout while the
  surface handles editing.
source:
  element: src/components/input/input-element.ts
  css: src/components/input/input.css
  registration: src/components/input/input.ts
  demo: src/components/input/input.html
attributes:
  value:
    type: string
    description: Current text value
  placeholder:
    type: string
    description: Placeholder text shown when empty
  disabled:
    type: boolean
    description: Disables interaction
  readonly:
    type: boolean
    description: Prevents editing while remaining focusable
  required:
    type: boolean
    description: Marks as required for form validation
  pattern:
    type: string
    description: Regex pattern for constraint validation
  type:
    type: string
    description: Input type ("text" or "password") — password masks via CSS text-security
  formatting:
    type: string
    description: Space-separated list of enabled formats (e.g. "code")
  name:
    type: string
    description: Form field name
css_attributes:
  inline:
    type: boolean
    description: No-op (kept for backward compatibility). Inputs are inline-flex by default since 0.7.161.
events:
  native:format:
    description: Fired after formatting with `{ type, value }` detail
  native:input:
    description: Fired on each keystroke with `{ value }` detail
  native:change:
    description: Fired on blur with `{ value }` detail
slots:
  leading:
    description: Content before the input surface (e.g. search icon), ordered via CSS
  trailing:
    description: Content after the input surface (e.g. clear button), ordered via CSS
css_tokens:
  --n-background:
    description: Background color
    default: var(--n-control)
  --n-background-disabled:
    description: Background when disabled
    default: var(--n-control-disabled)
  --n-background-hover:
    description: Background on hover
    default: var(--n-control-hover)
  --n-border-color:
    description: Border color
    default: var(--n-border-rest)
  --n-border-color-disabled:
    description: Border when disabled
    default: transparent
  --n-border-color-hover:
    description: Border on hover
    default: var(--n-border-muted)
  --n-border-muted:
    description: Muted border color
  --n-border-rest:
    description: Default border color at rest (tier-1 definition)
  --n-color:
    description: Text/foreground color
    default: var(--n-ink)
  --n-color-disabled:
    description: Text when disabled
    default: var(--n-ink-disabled)
  --n-color-hover:
    description: Text on hover
    default: var(--n-ink-hover)
  --n-control:
    description: Control surface color (tier-1 definition)
  --n-control-disabled:
    description: Control surface color when disabled (tier-1 definition)
  --n-control-hover:
    description: Control surface color on hover (tier-1 definition)
  --n-control-line-height:
    description: Line height
  --n-duration:
    description: Transition duration
  --n-easing:
    description: Transition easing
  --n-focus-ring:
    description: Focus ring style
  --n-font-size:
    description: Font size
  --n-font-weight:
    description: Font weight
    default: var(--n-input-font-weight)
  --n-ink:
    description: Ink (text) color
  --n-ink-disabled:
    description: Ink when disabled
  --n-ink-hover:
    description: Ink on hover
  --n-ink-placeholder:
    description: Ink (text) color
  --n-ink-strong:
    description: Ink (text) color
  --n-input-font-weight:
    description: Font weight
  --n-letter-spacing:
    description: Letter spacing
  --n-line-height:
    description: Line height
    default: var(--n-control-line-height)
  --n-panel:
    description: Panel surface color (tier-1 definition)
  --n-panel-hover:
    description: Panel surface color on hover (tier-1 definition)
  --n-radius:
    description: Border radius
  --n-size:
    description: Component height
  --n-space:
    description: Block/gap spacing
  --n-space-k:
    description: Inline padding multiplier
traits:
  compatible: [hover, focus-visible, tooltip]
  incompatible: []
a11y:
  role: textbox
  form_associated: true
  keyboard:
    - key: Enter
      action: Submits the parent form (implicit submission), prevented inside n-combobox
    - key: Cmd/Ctrl+E
      action: Toggles code formatting on the selected text when formatting="code" is enabled
behavior:
  - trigger: input
    actions: [Updates form value, dispatches native:input with current value]
  - trigger: blur
    actions: [Dispatches native:change with final value]
  - trigger: mousedown on host
    actions: [Redirects focus to the inner contenteditable surface]
compose:
  children: [n-icon, span]
  parents: [n-combobox, n-field, form]
