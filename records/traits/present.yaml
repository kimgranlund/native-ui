trait: present
controller: PresentController
description: "Shows content in a full-viewport dialog overlay with an optional close button. Wraps the host element in a
  modal `<dialog>` at its current DOM position. `showModal()` promotes to the top layer for rendering, so the dialog
  stays in the original DOM context — CSS custom properties inherit normally. On dismiss the host is unwrapped back to
  its original position. Events: - `native:present` — dispatched after dialog opens - `native:dismiss` — dispatched
  after dialog closes and host is restored"
source:
  controller: src/traits/present/present-controller.ts
  adapter: src/traits/present/presentable-adapter.ts
  demo: src/traits/present/presentable.html
  test: src/traits/present/present-controller.test.ts
options:
  inset:
    type: string
    description: "Safety margin from viewport edges (default: '2rem')"
  closeButton:
    type: boolean
    description: "Show close X button in top-right corner (default: true)"
injected_events:
  native:present:
    detail:
  native:dismiss:
    detail:
methods:
  present:
    returns: void
  toggle:
    returns: void
  dismiss:
    returns: void
  destroy:
    returns: void
consumption:
  imperative: new PresentController(element, options)
  provider: <n-controller traits="present">
  self_trait: <n-button traits="present">
behavior:
  - trigger: "present() called"
    actions:
      - "Creates a native <dialog> with dark backdrop and centering wrapper"
      - "Optionally adds a close button in top-right corner"
      - "Moves host into dialog at its original DOM position (preserves CSS inheritance)"
      - "Sets _reparenting flag on host and descendants to prevent teardown/setup"
      - "Opens dialog via showModal() (promotes to top layer)"
      - "Sets presented attribute on host"
      - "Dispatches native:present"
  - trigger: "Escape key pressed (native cancel event)"
    actions:
      - "Prevents default cancel behavior"
      - "Calls dismiss()"
  - trigger: "Click on dialog backdrop"
    actions:
      - "Calls dismiss()"
  - trigger: "dismiss() called"
    actions:
      - "Closes native dialog"
      - "Replaces dialog element with host (restores original DOM position)"
      - "Removes presented attribute"
      - "Dispatches native:dismiss"
a11y:
  keyboard:
    - key: "Escape"
      action: "Dismisses the presentation overlay"
